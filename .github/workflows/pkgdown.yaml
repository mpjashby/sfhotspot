# Deploy the pkgdown site built locally and committed to docs/.
name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pkgdown.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Deploy site via FTP
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.lesscrime.info
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./docs/
          server-dir: /subdomains/pkgs/sfhotspot/
