url: https://pkgs.lesscrime.info/sfhotspot
template:
  bootstrap: 5

authors:
  Matt Ashby:
    href: https://lesscrime.info

reference:
- title: "Analysing hotspots"
  desc: "Tools for analysing hotspots."
- contents:
  - hotspot_count
  - hotspot_change
  - hotspot_kde
  - hotspot_dual_kde
  - hotspot_gistar
  - hotspot_dbscan
  - starts_with("hotspot_classify")
- title: "Data wrangling"
  desc: > 
    Tools for working with data that is used to identify hotspots. Most data
    wrangling is done automatically by the analysis functions listed above, but 
    you can use the functions below to control in more detail how this is done.
- contents: 
  - hotspot_clip
  - hotspot_grid
  - st_transform_auto
- title: "Plotting results"
  desc: >
    `hotspot_map()` creates complete maps, while `hotspot_layer()` creates
    layers that can be combined with other ggplot2 layers. The `autoplot()`
    methods automatically produce charts tailored to the results from the
    `hotspot_*()` family of functions. `hotspot_isoband()` generalises the
    polygons produced by the hotspot-analysis functions into polygons, which
    can sometimes be preferable for plotting.
- contents:
  - hotspot_map
  - hotspot_layer
  - hotspot_isoband
  - starts_with("autoplot")
- title: "Sample data"
  desc: "Sample data that can be used with the functions in this package."
- contents:
  - starts_with("memphis_")
