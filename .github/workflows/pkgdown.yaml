# Deploy the pkgdown site built locally and committed to docs/.
name: pkgdown

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pkgdown.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: pkgdown-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Check deployment credentials
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for secret_name in FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::${secret_name} is unavailable. Configure it in this repository's Settings > Secrets and variables > Actions. If it is an environment secret, set jobs.pkgdown.environment to that environment's name."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.lesscrime.info
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./docs/
          server-dir: /subdomains/pkgs/sfhotspot/
